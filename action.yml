name: "Anti-Slop Engineering Guard"
description: "Clean-room AI coding guard, PR boundary triage, AST slop detector, honeypot sensor, and Google SRE discipline for GitHub Pull Requests."
author: "Mamdouh Aboammar <mamdouhfces1997@gmail.com>"

inputs:
  base:
    description: "Base commit or branch to compare against (default: HEAD~1 or origin/main)"
    required: false
    default: "HEAD~1"
  pr-title:
    description: "PR title string to evaluate against conventional commits and length bounds"
    required: false
    default: ""
  pr-body-file:
    description: "Path to file containing PR description markdown"
    required: false
    default: ""
  template-file:
    description: "Path to repository PR template markdown"
    required: false
    default: ".github/pull_request_template.md"
  fail-on-blocker:
    description: "Whether to fail the action if blocker-severity findings are detected"
    required: false
    default: "true"
  canary-token:
    description: "Active HMAC canary token to verify against hallucinated bot echoes"
    required: false
    default: ""

outputs:
  status:
    description: "Overall audit status (PASSED, BLOCKED, or ERROR)"
    value: ${{ steps.anti-slop-audit.outputs.status }}
  findings-count:
    description: "Total number of findings identified"
    value: ${{ steps.anti-slop-audit.outputs.findings-count }}
  blockers-count:
    description: "Number of blocker-severity findings identified"
    value: ${{ steps.anti-slop-audit.outputs.blockers-count }}

runs:
  using: "composite"
  steps:
    - name: Run Anti-Slop Multi-Guard Audit
      id: anti-slop-audit
      shell: bash
      env:
        AUDIT_BASE: ${{ inputs.base }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY_FILE: ${{ inputs.pr-body-file }}
        TEMPLATE_FILE: ${{ inputs.template-file }}
        CANARY_TOKEN: ${{ inputs.canary-token }}
        FAIL_ON_BLOCKER: ${{ inputs.fail-on-blocker }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [[ "$FAIL_ON_BLOCKER" != "true" && "$FAIL_ON_BLOCKER" != "false" ]]; then
          echo "Invalid fail-on-blocker value: expected true or false" >&2
          exit 2
        fi
        if ! git rev-parse --verify --quiet --end-of-options "${AUDIT_BASE}^{commit}" >/dev/null; then
          echo "Invalid audit base revision" >&2
          exit 2
        fi
        python3 -c '
        import pathlib
        import sys
        workspace = pathlib.Path(sys.argv[1]).resolve()
        for value in sys.argv[2:]:
            if value and not pathlib.Path(value).resolve().is_relative_to(workspace):
                sys.exit("Input file path must stay inside GITHUB_WORKSPACE")
        ' "$GITHUB_WORKSPACE" "$PR_BODY_FILE" "$TEMPLATE_FILE"

        audit_args=(audit --base "$AUDIT_BASE" --json)
        if [ -n "$PR_TITLE" ]; then audit_args+=(--pr-title "$PR_TITLE"); fi
        if [ -n "$PR_BODY_FILE" ]; then audit_args+=(--pr-body-file "$PR_BODY_FILE"); fi
        if [ -n "$TEMPLATE_FILE" ]; then audit_args+=(--template-file "$TEMPLATE_FILE"); fi
        if [ -n "$CANARY_TOKEN" ]; then audit_args+=(--canary-token "$CANARY_TOKEN"); fi

        set +e
        python3 -u "$ACTION_PATH/scripts/audit_runner.py" "${audit_args[@]}" > audit_result.json
        audit_exit=$?
        set -e

        result_args=(--report audit_result.json --audit-exit "$audit_exit"
          --fail-on-blocker "$FAIL_ON_BLOCKER" --github-output "$GITHUB_OUTPUT")
        if [ -n "$CANARY_TOKEN" ]; then result_args+=(--canary-present); fi
        python3 -u "$ACTION_PATH/scripts/action_result.py" "${result_args[@]}"
