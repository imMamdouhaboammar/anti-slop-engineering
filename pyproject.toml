[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-slop-engineering"
version = "0.2.1"
description = "An Engineering Discipline Playbook & Guard System for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Mamdouh Aboammar", email = "mamdouhfces1997@gmail.com" }
]
keywords = [
  "ai-agents",
  "anti-slop",
  "code-quality",
  "code-review",
  "engineering-discipline",
  "software-engineering",
  "agent-skills",
  "test-integrity",
  "diff-guard"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/imMamdouhaboammar/anti-slop-engineering"
Repository = "https://github.com/imMamdouhaboammar/anti-slop-engineering"
Issues = "https://github.com/imMamdouhaboammar/anti-slop-engineering/issues"

[project.scripts]
diff-guard = "scripts.diff_guard:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py39"
