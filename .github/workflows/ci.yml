name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  action-input-security:
    name: Composite action rejects script injection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: hostile-input
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          title = (
              'fix: "quoted" $(touch action-unexpected-command); & | `literal`\n'
              + '$' + '{{ github.event.pull_request.title }}'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('title<<ACTION_TITLE_END\n' + title + '\nACTION_TITLE_END\n')
          PY
      - uses: ./
        id: action-under-test
        with:
          base: HEAD
          pr-title: ${{ steps.hostile-input.outputs.title }}
          fail-on-blocker: 'false'
      - name: Assert hostile input stayed literal
        shell: bash
        env:
          EXPECTED_TITLE: ${{ steps.hostile-input.outputs.title }}
          ACTION_STATUS: ${{ steps.action-under-test.outputs.status }}
          FINDINGS_COUNT: ${{ steps.action-under-test.outputs.findings-count }}
          BLOCKERS_COUNT: ${{ steps.action-under-test.outputs.blockers-count }}
        run: |
          test ! -e action-unexpected-command
          [[ "$ACTION_STATUS" == "PASSED" || "$ACTION_STATUS" == "BLOCKED" ]]
          [[ "$FINDINGS_COUNT" =~ ^[0-9]+$ ]]
          [[ "$BLOCKERS_COUNT" =~ ^[0-9]+$ ]]
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path('audit_result.json').read_text(encoding='utf-8'))
          assert result['guards']['pr_boundary_guard']['pr_metadata']['title'] == os.environ['EXPECTED_TITLE']
          PY

  test-python:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ruff
        if: matrix.python-version == '3.12'
        run: pip install "ruff>=0.17.4"

      - name: Lint with Ruff
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Verify Python syntax
        run: python -m py_compile scripts/diff_guard.py scripts/sre_guard.py scripts/decision_guard.py scripts/root_fix_guard.py scripts/future_scale_guard.py scripts/bump_version.py tests/test_diff_guard.py tests/test_sre_guard.py tests/test_decision_guard.py tests/test_root_fix_guard.py tests/test_future_scale_guard.py tests/test_bump_version.py

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

      - name: Run diff guard against HEAD
        run: python scripts/diff_guard.py --base HEAD
      - name: Validate bundled decision example
        run: python scripts/decision_guard.py audit skills/decision-guard/examples/architecture-record.json --json
      - name: Validate bundled root-fix example
        run: python scripts/root_fix_guard.py audit skills/root-fix-gate/examples/email-checkout-record.json --json
      - name: Validate bundled future-scale example
        run: python scripts/future_scale_guard.py audit skills/future-scale-gate/examples/runtime-envelope-record.json --json

  validate-distribution:
    name: Validate Universal Distribution & CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Oxlint Linter
        run: bun run oxlint

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify CLI Execution with Node.js
        run: |
          node ./bin/cli.js --help
          node ./bin/cli.js --base HEAD

      - name: Verify CLI Execution with Bun
        run: |
          bun ./bin/cli.js --help
          bun ./bin/cli.js --base HEAD

      - name: Run Bun Security Regression Suite
        run: bun run test:security

      - name: Verify Universal Installer
        run: |
          bash ./install.sh --all
          test -f "$HOME/.agents/skills/anti-slop-engineering/SKILL.md"
          test -f "$HOME/.agents/skills/root-fix-gate/SKILL.md"

      - name: Validate Skill & Distribution Manifests
        run: |
          python3 -c "
          import json

          # 1. Validate SKILL.md
          skill = open('SKILL.md').read()
          assert skill.startswith('---'), 'Missing YAML frontmatter'
          assert 'name: anti-slop-engineering' in skill, 'Missing skill name'

          # 2. Validate package.json
          pkg = json.load(open('package.json'))
          assert pkg['name'] == 'anti-slop-engineering'
          assert 'bin' in pkg

          # 3. Validate marketplace.json
          mkt = json.load(open('marketplace.json'))
          assert mkt['name'] == 'anti-slop-engineering'

          # 4. Validate .skills.json
          sk = json.load(open('.skills.json'))
          assert sk['name'] == 'anti-slop-engineering'
          print('All multi-agent manifests validated successfully!')
          "

  test-native:
    name: Test Rust and Go engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/toil-guard-go/go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Rust Clippy linting
        working-directory: services/anti-slop-rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust unit tests
        working-directory: services/anti-slop-rust
        run: cargo test --all-targets --locked
      - name: Go unit and race tests
        working-directory: services/toil-guard-go
        run: go test -race ./...
      - name: Native vs Python fallback differential contract tests
        env:
          REQUIRE_NATIVE_PARITY: "1"
        run: |
          cargo build --manifest-path services/anti-slop-rust/Cargo.toml --locked
          python3 -m unittest tests/test_engine_parity.py -v
      - name: Native CLI failure contracts
        run: |
          if cargo run --manifest-path services/anti-slop-rust/Cargo.toml --locked -- ladder-audit does-not-exist.rs; then exit 1; fi
          if cargo run --manifest-path services/anti-slop-rust/Cargo.toml --locked -- triage --base nonexistent-revision-123; then exit 1; fi
          cd services/toil-guard-go
          if go run ./cmd/toil-guard audit missing-path-go-123; then exit 1; fi
      - name: npm package includes native sources
        run: |
          npm pack --dry-run --json > pack.json
          node -e 'const f=require("./pack.json")[0].files.map(x=>x.path); for (const p of ["services/anti-slop-rust/Cargo.toml","services/toil-guard-go/go.mod","services/toil-guard-go/cmd/toil-guard/main.go","skills/decision-guard/SKILL.md","scripts/decision_guard.py","skills/root-fix-gate/SKILL.md","scripts/root_fix_guard.py"]) if(!f.includes(p)) process.exitCode=1'
      - name: CLI and alias regression tests
        run: |
          node --check bin/cli.js
          node --test tests/test_cli.mjs
